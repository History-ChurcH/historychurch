# GitHub 웹(또는 휴대폰 브라우저)에서 public/uploads 에 jpg·png 사진을 올리면,
# 홈페이지용 WebP 로 줄여서 다시 커밋합니다. (휴대폰 원본 사진이 저장소를 무겁게 만들지 않도록)
# 관리자 화면(/admin)으로 올린 사진은 이미 WebP 라서 이 작업이 할 일이 없습니다.
name: 올린 사진 자동으로 줄이기

on:
  push:
    branches: [main]
    paths:
      - 'public/uploads/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-uploads
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - id: optimize
        run: node scripts/optimize-uploads.mjs

      - name: 줄인 사진 저장
        if: steps.optimize.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/uploads src/content src/data
          git commit -m "사진 ${{ steps.optimize.outputs.count }}장 자동으로 줄임 (WebP)"
          # 그사이 다른 커밋(설교 자동 추가 등)이 올라왔으면 위에 얹어서 올립니다.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
