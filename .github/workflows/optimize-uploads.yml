# GitHub 웹(또는 휴대폰 브라우저)으로 올린 파일을 홈페이지에 맞게 정리해서 다시 커밋합니다.
#  1) 이름에 날짜가 없는 주보·글 파일에 날짜를 붙입니다. (IMG_1234.jpg → 2026-10-11-1.jpg, 제목.docx → 2026-10-11 제목.docx)
#  2) 400KB 넘는 jpg·png 를 홈페이지용 WebP 로 줄입니다. (휴대폰 원본 사진이 저장소를 무겁게 만들지 않도록)
# 관리자 화면(/admin)으로 올린 글·사진은 이미 정리되어 있어서 이 작업이 할 일이 없습니다.
name: 올린 파일 자동 정리

on:
  push:
    branches: [main]
    paths:
      - 'public/uploads/**'
      - '주보/**'
      - 'src/content/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-uploads
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - id: dates
        run: node scripts/date-uploads.mjs

      - id: optimize
        run: node scripts/optimize-uploads.mjs

      - name: 정리한 파일 저장
        if: steps.dates.outputs.changed == 'true' || steps.optimize.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A 주보 public/uploads src/content src/data
          git commit -m "올린 파일 정리: 날짜 붙임 ${{ steps.dates.outputs.count || 0 }}개, 사진 줄임 ${{ steps.optimize.outputs.count || 0 }}장"
          # 그사이 다른 커밋(설교 자동 추가 등)이 올라왔으면 위에 얹어서 올립니다.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
