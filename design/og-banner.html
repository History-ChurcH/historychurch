<script>
  // 빛의 십자가: 로고 속 금색 십자가의 세로·가로 막대 위치에 빛줄기를 맞춥니다.
  function place() {
    const og = document.getElementById('og').getBoundingClientRect();
    const cross = document.getElementById('cross');
    const r = cross.getBoundingClientRect();
    const len = cross.getTotalLength();
    const svg = cross.ownerSVGElement;
    const m = cross.getScreenCTM();
    let minX = Infinity, maxX = -Infinity; const pts = [];
    for (let i = 0; i <= 600; i++) {
      const p = cross.getPointAtLength((len * i) / 600).matrixTransform(m);
      pts.push(p); minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    }
    const edge = pts.filter((p) => p.x < minX + 2 || p.x > maxX - 2).map((p) => p.y);
    const barY = (Math.min(...edge) + Math.max(...edge)) / 2 - og.top;
    const cx = r.left + r.width / 2 - og.left;
    document.getElementById('bv').style.left = cx + 'px';
    // 가로 빛줄기는 교회 이름 글자에 닿기 전에 사라지게 합니다.
    const textLeft = document.querySelector('.type').getBoundingClientRect().left - og.left;
    Object.assign(document.getElementById('bh').style, { top: barY + 'px', width: Math.min(cx * 1.6, textLeft - 24) + 'px' });
    Object.assign(document.getElementById('glow').style, { left: cx + 'px', top: barY + 'px' });
  }
  document.fonts.ready.then(() => { place(); document.body.dataset.ready = '1'; });
</script>
