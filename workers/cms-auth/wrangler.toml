# 관리자 화면 'GitHub로 로그인' 인증 서버 — 배포: npx wrangler deploy (이 폴더에서)
# 코드 출처: https://github.com/sveltia/sveltia-cms-auth (MIT, LICENSE.txt 참고). 고치지 말고 그대로 쓰세요.
name = "historychurch-cms-auth"
main = "src/index.js"
compatibility_date = "2023-03-24"
workers_dev = true
# 대시보드에 넣은 GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET 을 다시 배포해도 지우지 않습니다.
keep_vars = true

[vars]
# 이 주소의 관리자 화면에서만 로그인 토큰을 받을 수 있습니다. (다른 사이트가 이 서버를 악용하지 못하게 막음)
ALLOWED_DOMAINS = "historychurch.soul0691.workers.dev, historychurch.org, www.historychurch.org"
